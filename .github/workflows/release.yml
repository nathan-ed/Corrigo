name: release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (e.g. 1.5.0)
        required: true

permissions:
  contents: write

env:
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  name: linux }
          - { os: windows-latest, name: windows }
          - { os: macos-15-intel, name: macos-x64 }
          - { os: macos-latest,   name: macos-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Compute version
        shell: bash
        run: echo "APP_VERSION=${VERSION#v}" >> "$GITHUB_ENV"

      - name: Package (Linux)
        if: matrix.name == 'linux'
        run: |
          chmod +x gradlew
          ./gradlew autoPackage -PjdkPath="$JAVA_HOME" -PappVersion="$APP_VERSION"
          mkdir out && cp build/AutoPackage/Corrigo-Linux-* out/

      - name: Package (Windows)
        if: matrix.name == 'windows'
        shell: bash
        run: |
          ./gradlew jpackage -PjdkPath="$JAVA_HOME" -PappVersion="$APP_VERSION"
          mkdir out
          cp build/jpackage/*.msi "out/Corrigo-Windows-${APP_VERSION}.msi"
          powershell -Command "Compress-Archive -Path build/jpackage/Corrigo -DestinationPath out/Corrigo-Windows-${APP_VERSION}.zip"

      - name: Package (macOS)
        if: startsWith(matrix.name, 'macos')
        run: |
          chmod +x gradlew
          ./gradlew jpackage -PjdkPath="$JAVA_HOME" -PappVersion="$APP_VERSION"
          suffix=$([ "${{ matrix.name }}" = macos-arm64 ] && echo AArch64- || echo "")
          mkdir out
          cp build/jpackage/*.dmg "out/Corrigo-MacOSX-${suffix}${APP_VERSION}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: corrigo-${{ matrix.name }}
          path: out/*

  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          draft: true
          generate_release_notes: true
          files: dist/*
